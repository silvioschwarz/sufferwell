<script type='text/javascript' > 
  let countdownDate = new Date("Sep 8, 2026 7:59:59").getTime();
  let now = new Date().getTime();
  let distance = countdownDate - now;
  let days = Math.floor(distance / (1000 * 60 * 60 * 24));
  let weeks = 1;//Math.ceil(days / 7);
  const embed = document.getElementById("embed");
const audio = document.getElementById("audio");
const btn = document.getElementById("enter");


  let phases = 6;

  localStorage.setItem("Weeks", weeks);

  localStorage.setItem("Distance", distance);
  localStorage.setItem("Phases", phases);

  function myFunction(e) {

    let topNumber = 6- e.target.value;
    localStorage.setItem("Weeks", topNumber);


    console.log("Selected Phase: " + topNumber);
    document.getElementById("top-number").innerHTML = topNumber;

    if (topNumber > "2") {
      embed.setAttribute("src", "./8M9C99S_27/index.html");
    }


  if (topNumber == "2") {
    embed.setAttribute("src", "./8M9C99S_27/matrix.html");
  }

  if (topNumber == "1") {
    embed.setAttribute("src", "./8M9C99S_27/newBeginnings.html");
  }

  if (topNumber == "0") {
    embed.setAttribute("src", "./8M9C99S_27/index.html");
    btn.style.display = "block";

    btn.addEventListener("click", function () {
      audio.src = "8M9C99S_27/audio/8M9C99S_27.mp3";
      audio.controls = false;
      audio.play();

      /*
    audio.src = "8M9C99S_27/audio/Jeopardy.mp3";
    audio.play();
    audio.loop=true;
    */
      btn.style.display = "none";
    });
  }
}

  
</script>
