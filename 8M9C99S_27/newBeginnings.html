<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Beginnings</title>

  <style>
    /* Google Fonts */
    @import url(https://fonts.googleapis.com/css?family=Anonymous+Pro);

    /* Global */
    html {
      min-height: 100%;
      overflow: hidden;
    }

    body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      padding: 4em;
      color: rgba(255, 255, 255, 0.75);
      font-family: "Anonymous Pro", monospace;
      background-color: rgb(25, 25, 25);
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 20dvh;
      height: 100%;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 30dvh;
    }

    .line-1 {
      position: relative;
      top: 50%;
      width: calc(1dvh + 1dvw);
      margin: 0 auto;
      border-right: 2px solid rgba(255, 255, 255, 0.75);
      font-size: calc(2dvh + 2dvw);
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
    }

    button {
      display: none;
      width: 50dvw;
      height: 10dvh;
      border-radius: 40px;
      font-size: calc(2dvh + 2dvw);
      background-color: antiquewhite;
      cursor: pointer;
      align-items: center;
      text-align: center;
    }

    /* Animation */
    .anim-typewriter {
      animation:
        typewriter 2s steps(94) 3s 1 normal both,
        blinkTextCursor 500ms steps(94) infinite normal;
    }

    @keyframes typewriter {
      from {
        width: 0;
      }

      to {
        width: calc(40*(1dvh + 1dvw));
      }
    }

    @keyframes blinkTextCursor {
      from {
        border-right-color: rgba(255, 255, 255, 0.75);
      }

      to {
        border-right-color: transparent;
      }
    }
  </style>
</head>

<body>
  <div id="countdown"></div>
  <div id="container">
    <p id="mainText" class="line-1 anim-typewriter">
      Do you like waiting?
    </p>
    <button id="unmuteButton"></button>
    <audio id="audio">
      <source src="audio/Jeopardy.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

</body>
<script>
  const unmuteButton = document.getElementById("unmuteButton");
  const mainText = document.getElementById("mainText");

  const countdownDiv = document.getElementById("countdown");

  setInterval(() => {
    updateCountdown();
  }, 1000);

  function updateCountdown() {
    let countdownDate = new Date("Sep 8, 2026 7:59:59").getTime();
    let now = new Date().getTime();
    let distance = countdownDate - now;

    let weeks = localStorage.getItem('Weeks');
    let days = Math.floor(distance / (1000 * 60 * 60 * 24));

  let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  let seconds = Math.floor((distance % (1000 * 60)) / 1000);

  let phaseNum = days - (weeks -1) * 7;

     countdownDiv.innerHTML = "Phase " + (6 - weeks) + " of 6" + "<br>" + "Time left: " + phaseNum + "d " + hours + "h " + minutes + "m " + seconds + "s ";

  };

  setTimeout(()=>{
    unmuteButton.style.display = "block";
    unmuteButton.innerHTML="NO?"
  }, 10000)

  let clicks = 0;

  unmuteButton.addEventListener('click', function () {
    clicks += 1;

    if (clicks == 1) {
      mainText.innerHTML = "Are you sure?"
      mainText.classList.remove("anim-typewriter");
      void mainText.offsetWidth; 
      mainText.classList.add("anim-typewriter");
      unmuteButton.style.display = "none";
      setTimeout(()=>{
    unmuteButton.style.display = "block";
    unmuteButton.innerHTML="Stop the waiting!"
  }, 5000)
      unmuteButton.innerHTML = "Yes!";
    }

    else if (clicks == 2) {
      mainText.innerHTML ="This will reset"+ "<br><br>"+ "your waiting period.";
      mainText.classList.remove("anim-typewriter");
      void mainText.offsetWidth; 
      mainText.classList.add("anim-typewriter");
      unmuteButton.style.display = "none";
      setTimeout(()=>{
    unmuteButton.style.display = "block";
      unmuteButton.innerHTML = "For fuck's sake!";
  }, 7000);

    }
else {
      let txt = mainText.innerHTML;
      txt += "<br>" + "5 more hours";
      mainText.innerHTML = txt ;
      unmuteButton.innerHTML = "For fuck's sake!";
      audio.muted = false;
      audio.src = "audio/Jeopardy.mp3";
      audio.play();
    }

  });
</script>

</html>
